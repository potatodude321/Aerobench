[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerobench"
version = "0.2.0"
description = "Automotive external-aerodynamics workbench engine (OpenFOAM + ParaView orchestration)"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved" }
dependencies = [
  "pydantic>=2.9,<3",
  "numpy>=1.26",
  "scipy>=1.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "psutil>=5.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.6"]
# STEP/IGES/BREP import via OpenCASCADE (LGPL-2.1, in-process); the VTK-free build keeps the
# runtime ~50 MB smaller and pulls in no plotting stack
cad = ["cadquery-ocp-novtk>=7.8"]

[project.scripts]
aerobench = "aerobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aerobench = ["viz/server/*.py", "reports/templates/*.j2", "reports/templates/*.css", "project/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 1800
markers = [
  "openfoam: requires a working OpenFOAM installation (integration)",
  "paraview: requires pvpython (visualisation integration)",
  "slow: long-running engineering regression",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501: long lines are allowed up to the formatter's judgement; E731/E741/E702: style only;
# B008: FastAPI's Depends()/File() defaults; B904/B905: explicit by design; B027: optional hooks.
ignore = ["E501", "E731", "E741", "E702", "B008", "B904", "B905", "B027"]

[tool.ruff.lint.per-file-ignores]
"src/aerobench/viz/server/*.py" = ["E402"]
